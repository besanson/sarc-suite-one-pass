#
# SARC governance spec, authored in the real sarc_governance YAML schema
# (id / class / verif / response / predicate / description — see
# sarc_governance.specs.load_spec). Predicate names below are registered in
# composition.py via sarc_governance.predicates.register() BEFORE this file
# is loaded; role/cap thresholds are per-decision data read out of
# ctx["args"] at evaluation time, not baked into the spec.

constraints:
  - id: role_authorised
    class: hard
    verif: PAG
    response: block
    predicate: role_unauthorised
    description: >-
      Block when the acting role is not in the per-decision allowed-roles
      set (ctx.args.allowed_roles).

  - id: order_value_cap
    class: escalation
    verif: PAG
    response: escalate
    predicate: order_value_over_cap
    description: >-
      Escalate when order_value exceeds the per-decision cap
      (ctx.args.order_value_cap).
